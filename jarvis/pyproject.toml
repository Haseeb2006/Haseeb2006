[project]
name = "jarvis-mcp"
version = "0.1.0"
description = "A macOS MCP server: the hands of a personal assistant."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic[mcp]>=0.116",
    "mcp[cli]>=2.0",
]

[project.scripts]
jarvis-mcp = "mcp_server.server:main"
jarvis = "ui.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server", "core", "ui"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
